# About Section
# about_title: About Me (Use this to override about section title)
about_profile_image: assets/dan.jpg
about_content: | # this will include new lines to allow paragraphs
    Hi! I'm Dan 👋

    I am a creator partnerships and community operations professional working in gaming, currently supporting the PUBG Partner Program on PUBG: Battlegrounds at KRAFTON.

    My work sits at the intersection of creator relationships, campaign operations, community feedback and performance reporting. I enjoy turning messy, manual processes into clear workflows that help teams support creators, learn from their feedback and make better decisions.

    I also bring hands-on community experience from running gaming communities, events and tournaments. I care about making the experience better for both the people creating content and the players watching it.

# Projects Section
# projects_title: Projects #(Use this to override about projects section title)

# Experience Section
experience_title: Professional Experience

# Education Section
# education_title: Education #(Use this to override about education section title)

# More Section
# more_title: A Little More About Me #(Use this to override about more section title)
more_content: | # this will include new lines to allow paragraphs
    This is where you can write a little more about yourself. You could title this section **Interests** and include some of your other interests.

    Or you could title it **Skills** and write a bit more about things that make you more desirable, like *leadership* or *teamwork*

# Footer
footer_show_references: false

# Build settings
# theme: modern-resume-theme (Use this is you are hosting your resume yourself)
# remote_theme: sproogen/modern-resume-theme (Use this if you are hosting your resume on GitHub)

sass:
    sass_dir: _sass
    style: compressed

plugins:
    - jekyll-seo-tag

exclude:
    [
        'Gemfile',
        'Gemfile.lock',
        'node_modules',
        'vendor/bundle/',
        'vendor/cache/',
        'vendor/gems/',
        'vendor/ruby/',
        'lib/',
        'scripts/',
        'docker-compose.yml',
    ]

theme: jekyll-theme-minimal
